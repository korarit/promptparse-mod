<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="45%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#080d1a" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowCyan" cx="15%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowBlue" cx="60%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Text & Element Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#38bdf8" fill-opacity="0.12" />
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>

    <!-- Drop Shadows / Glows -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif; }
    .tag-text { font-size: 11.5px; font-weight: 600; letter-spacing: 0.3px; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="480" fill="url(#bgGrad)" />
  <rect width="1200" height="480" fill="url(#glowCyan)" />
  <rect width="1200" height="480" fill="url(#glowPurple)" />
  <rect width="1200" height="480" fill="url(#glowBlue)" />
  <rect width="1200" height="480" fill="url(#gridPattern)" opacity="0.8" />

  <!-- Abstract Decorative Circuit / Wire Vectors -->
  <g opacity="0.25">
    <path d="M 0 160 Q 200 160 300 240 T 600 220" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" fill="none" />
    <path d="M 700 80 Q 900 120 1000 60 T 1200 120" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 8" fill="none" />
    <circle cx="300" cy="240" r="3" fill="#38bdf8" />
    <circle cx="600" cy="220" r="4" fill="#818cf8" />
    <circle cx="1000" cy="60" r="3" fill="#c084fc" />
  </g>

  <!-- ==================== LEFT COLUMN: BRANDING & FEATURES ==================== -->
  <g transform="translate(64, 52)">
    <!-- Top Pill Badge -->
    <g>
      <rect x="0" y="0" width="375" height="30" rx="15" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="16" cy="15" r="4" fill="#00f2fe" filter="url(#neonGlow)" />
      <text x="30" y="19" class="font-mono tag-text" fill="#7dd3fc">PROMPTPAY &amp; EMVCo QR ENGINE v1.6.0</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="86" class="font-sans" font-size="52" font-weight="900" letter-spacing="-1.2px" fill="url(#titleGrad)" filter="url(#softShadow)">
      PromptParse<tspan fill="#38bdf8">-</tspan><tspan fill="#00f2fe">MOD</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="124" class="font-sans" font-size="19" font-weight="600" fill="#f1f5f9" letter-spacing="-0.2px">
      All-in-One Engine for Thai QR, AnyID &amp; EMVCo Standards
    </text>

    <!-- Description -->
    <text x="0" y="156" class="font-sans" font-size="14" font-weight="400" fill="#94a3b8" letter-spacing="0.1px">
      Generate &amp; parse payloads with full support for <tspan fill="#38bdf8" font-weight="600">Tag 59 Thai UTF-8</tspan>,
    </text>
    <text x="0" y="178" class="font-sans" font-size="14" font-weight="400" fill="#94a3b8" letter-spacing="0.1px">
      Dynamic initiation flags, Bill Payment, TrueMoney, and Slip Verify Mini-QR.
    </text>

    <!-- Feature Pills Grid -->
    <g transform="translate(0, 204)">
      <!-- Pill 1: Tag 59 UTF-8 -->
      <g transform="translate(0, 0)">
        <rect width="168" height="30" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
        <text x="12" y="19" class="font-mono" font-size="12" font-weight="600" fill="#38bdf8">✦ Tag 59 (Thai UTF-8)</text>
      </g>
      <!-- Pill 2: Dynamic QR -->
      <g transform="translate(176, 0)">
        <rect width="146" height="30" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#818cf8" stroke-width="1" stroke-opacity="0.3" />
        <text x="12" y="19" class="font-mono" font-size="12" font-weight="600" fill="#a5b4fc">✦ Dynamic QR (01)</text>
      </g>
      <!-- Pill 3: Slip Verify -->
      <g transform="translate(330, 0)">
        <rect width="144" height="30" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#c084fc" stroke-width="1" stroke-opacity="0.3" />
        <text x="12" y="19" class="font-mono" font-size="12" font-weight="600" fill="#d8b4fe">✦ Slip Verify QR</text>
      </g>

      <!-- Row 2 Pills -->
      <!-- Pill 4: Zero Dependencies -->
      <g transform="translate(0, 38)">
        <rect width="154" height="30" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#34d399" stroke-width="1" stroke-opacity="0.3" />
        <text x="12" y="19" class="font-mono" font-size="12" font-weight="600" fill="#6ee7b7">✓ 0 Dependencies</text>
      </g>
      <!-- Pill 5: CRC16 Validated -->
      <g transform="translate(162, 38)">
        <rect width="154" height="30" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.3" />
        <text x="12" y="19" class="font-mono" font-size="12" font-weight="600" fill="#fde68a">🛡️ CRC16 Checksum</text>
      </g>
      <!-- Pill 6: Cross-Platform -->
      <g transform="translate(324, 38)">
        <rect width="150" height="30" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#f472b6" stroke-width="1" stroke-opacity="0.3" />
        <text x="12" y="19" class="font-mono" font-size="12" font-weight="600" fill="#fbcfe8">⚡ Node • Bun • Deno</text>
      </g>
    </g>

    <!-- Installation Terminal Command -->
    <g transform="translate(0, 296)">
      <rect width="474" height="46" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.2" />
      <text x="18" y="28" class="font-mono" font-size="14" font-weight="700" fill="#38bdf8">$</text>
      <text x="36" y="28" class="font-mono" font-size="13.5" font-weight="500" fill="#e2e8f0">npm i <tspan fill="#38bdf8" font-weight="700">@korarit/promptparse-mod</tspan></text>
      
      <!-- Quick Copy Icon decoration -->
      <g transform="translate(436, 15)" opacity="0.6">
        <rect x="0" y="3" width="12" height="12" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.5" />
        <path d="M 3 3 L 3 0 L 15 0 L 15 12 L 12 12" fill="none" stroke="#94a3b8" stroke-width="1.5" />
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: CODE & QR CODE INTERACTIVE CARD ==================== -->
  <g transform="translate(585, 42)" filter="url(#softShadow)">
    <!-- Glassmorphic Window Container -->
    <rect width="550" height="396" rx="18" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.2" />
    
    <!-- Window Header -->
    <rect width="550" height="42" rx="18" fill="#0f172a" fill-opacity="0.6" />
    <!-- Rounded top clip fix -->
    <path d="M 0 18 Q 0 0 18 0 L 532 0 Q 550 0 550 18 L 550 42 L 0 42 Z" fill="#0f172a" fill-opacity="0.7" />
    
    <!-- Window Controls -->
    <circle cx="22" cy="21" r="5.5" fill="#ef4444" opacity="0.85" />
    <circle cx="38" cy="21" r="5.5" fill="#f59e0b" opacity="0.85" />
    <circle cx="54" cy="21" r="5.5" fill="#10b981" opacity="0.85" />
    
    <text x="76" y="26" class="font-mono" font-size="12" fill="#64748b">promptpay-tag30-demo.ts</text>
    
    <!-- Active Status Indicator -->
    <g transform="translate(436, 12)">
      <rect width="98" height="18" rx="9" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="10" cy="9" r="3" fill="#10b981" />
      <text x="18" y="13" class="font-mono" font-size="9.5" font-weight="600" fill="#6ee7b7">EMVCo VALID</text>
    </g>

    <!-- Code Block -->
    <g transform="translate(22, 60)" class="font-mono" font-size="11.8">
      <text y="14" fill="#94a3b8"><tspan fill="#c084fc">import</tspan> { generate } <tspan fill="#c084fc">from</tspan> <tspan fill="#38bdf8">'@korarit/promptparse-mod'</tspan></text>
      
      <text y="38" fill="#94a3b8"><tspan fill="#818cf8">const</tspan> payload = generate.billPayment({</text>
      <text y="58" fill="#cbd5e1">  billerId: <tspan fill="#38bdf8">'010555912345600'</tspan>,</text>
      <text y="76" fill="#cbd5e1">  amount: <tspan fill="#fbbf24">1250.00</tspan>,</text>
      <text y="94" fill="#cbd5e1">  merchantName: <tspan fill="#34d399">'บริษัท พร้อมเพย์ จำกัด'</tspan>, <tspan fill="#64748b">// Tag 59 (Thai UTF-8)</tspan></text>
      <text y="112" fill="#cbd5e1">  ref1: <tspan fill="#38bdf8">'INV-2026-889'</tspan>,</text>
      <text y="130" fill="#cbd5e1">  ref2: <tspan fill="#38bdf8">'CUST-007'</tspan>,</text>
      <text y="148" fill="#cbd5e1">  dynamic: <tspan fill="#f43f5e">true</tspan> <tspan fill="#64748b">// Dynamic QR Tag 01</tspan></text>
      <text y="166" fill="#94a3b8">})</text>
    </g>

    <!-- Lower Section: QR Visualization & Output Payload Box -->
    <g transform="translate(22, 240)">
      <!-- Mini Output Container -->
      <rect width="506" height="136" rx="12" fill="#090d16" fill-opacity="0.9" stroke="#1e293b" stroke-width="1" />

      <!-- Left Sub-card: Interactive QR Vector Representation -->
      <g transform="translate(14, 14)">
        <!-- QR Code Canvas Base -->
        <rect width="108" height="108" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />

        <!-- Position Detection Pattern 1: Top-Left -->
        <rect x="8" y="8" width="28" height="28" rx="4" fill="none" stroke="#38bdf8" stroke-width="2.5" />
        <rect x="14" y="14" width="16" height="16" rx="2" fill="#38bdf8" />

        <!-- Position Detection Pattern 2: Top-Right -->
        <rect x="72" y="8" width="28" height="28" rx="4" fill="none" stroke="#38bdf8" stroke-width="2.5" />
        <rect x="78" y="14" width="16" height="16" rx="2" fill="#38bdf8" />

        <!-- Position Detection Pattern 3: Bottom-Left -->
        <rect x="8" y="72" width="28" height="28" rx="4" fill="none" stroke="#38bdf8" stroke-width="2.5" />
        <rect x="14" y="78" width="16" height="16" rx="2" fill="#38bdf8" />

        <!-- Stylized QR Matrix Dots (Mock Thai PromptPay Matrix) -->
        <g fill="#38bdf8" opacity="0.85">
          <rect x="42" y="10" width="5" height="5" rx="1" />
          <rect x="52" y="10" width="10" height="5" rx="1" />
          <rect x="42" y="20" width="8" height="5" rx="1" />
          <rect x="56" y="20" width="6" height="5" rx="1" />
          <rect x="44" y="30" width="20" height="4" rx="1" />

          <!-- Center Alignment Pattern -->
          <rect x="46" y="46" width="16" height="16" rx="2" fill="none" stroke="#818cf8" stroke-width="2" />
          <rect x="51" y="51" width="6" height="6" rx="1" fill="#818cf8" />

          <rect x="10" y="44" width="24" height="4" rx="1" />
          <rect x="12" y="54" width="6" height="8" rx="1" />
          <rect x="24" y="52" width="8" height="10" rx="1" />

          <rect x="74" y="44" width="24" height="5" rx="1" />
          <rect x="82" y="56" width="12" height="5" rx="1" />

          <rect x="42" y="70" width="8" height="12" rx="1" />
          <rect x="54" y="68" width="14" height="6" rx="1" />
          <rect x="52" y="80" width="16" height="8" rx="1" />

          <rect x="42" y="94" width="12" height="5" rx="1" />
          <rect x="60" y="92" width="40" height="6" rx="1" />
          <rect x="74" y="76" width="26" height="8" rx="1" />
        </g>

        <!-- Futuristic Scan Beam Animation Effect (Static Vector Gradient) -->
        <line x1="6" y1="52" x2="102" y2="52" stroke="#00f2fe" stroke-width="2" opacity="0.8" filter="url(#neonGlow)" />
      </g>

      <!-- Right Sub-card: Payload Stream & Badges -->
      <g transform="translate(136, 16)">
        <text x="0" y="12" class="font-mono" font-size="11" font-weight="700" fill="#38bdf8">EMVCo TLV OUTPUT STREAM</text>
        
        <!-- Payload snippet box -->
        <g transform="translate(0, 20)">
          <rect width="356" height="46" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1" />
          <text x="10" y="18" class="font-mono" font-size="10.5" fill="#64748b">000201<tspan fill="#f43f5e">010212</tspan>30670016A000000677010112</text>
          <text x="10" y="34" class="font-mono" font-size="10.5" fill="#64748b">0115010555912345600<tspan fill="#34d399">5924...</tspan>6304<tspan fill="#38bdf8" font-weight="700">D78F</tspan></text>
        </g>

        <!-- Status Badges Below -->
        <g transform="translate(0, 78)">
          <!-- Tag 59 Status -->
          <rect width="112" height="20" rx="6" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.4" />
          <text x="8" y="14" class="font-mono" font-size="9.5" font-weight="600" fill="#34d399">Tag 59: UTF-8 OK</text>

          <!-- Dynamic Status -->
          <rect x="120" width="105" height="20" rx="6" fill="#f43f5e" fill-opacity="0.12" stroke="#f43f5e" stroke-width="0.8" stroke-opacity="0.4" />
          <text x="128" y="14" class="font-mono" font-size="9.5" font-weight="600" fill="#fb7185">Tag 01: Dynamic</text>

          <!-- CRC16 Status -->
          <rect x="233" width="123" height="20" rx="6" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
          <text x="241" y="14" class="font-mono" font-size="9.5" font-weight="600" fill="#38bdf8">CRC16: 0xD78F [OK]</text>
        </g>
      </g>
    </g>
  </g>
</svg>
